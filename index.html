<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生必做 100 件事 - 跨裝置雲端同步版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 登入 / 註冊遮罩層 (未登入時顯示) -->
  <div id="authOverlay" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 relative overflow-hidden">
      
      <!-- 標題區 -->
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-indigo-200 mb-3">100</div>
        <h2 id="authTitle" class="text-2xl font-bold text-slate-900">歡迎回來</h2>
        <p class="text-sm text-slate-500 mt-1">獨立雲端空間，多裝置自動同步</p>
      </div>

      <!-- 登入表單 -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div id="nameFieldContainer" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1">顯示名稱 (姓名/暱稱)</label>
          <input type="text" id="regName" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="例如：志鵬">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">電子信箱</label>
          <input type="email" id="authEmail" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="yourname@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">密碼 (至少 6 碼)</label>
          <input type="password" id="authPassword" required minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
        </div>

        <div class="flex items-center justify-between text-xs">
          <button type="button" onclick="toggleForgotPassword()" class="text-indigo-600 hover:underline">忘記密碼？</button>
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
          登入系統
        </button>
      </form>

      <!-- 切換按鈕 -->
      <div class="text-center mt-6 text-xs text-slate-500">
        <span id="authToggleText">還沒有帳號？</span>
        <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-indigo-600 font-semibold hover:underline ml-1">立即註冊</button>
      </div>
    </div>
  </div>

  <!-- 主導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">100</div>
        <h1 class="text-lg font-bold text-slate-900">人生必做清單</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userDisplayName" class="text-sm font-medium text-slate-600">載入中...</span>
        <button onclick="handleLogout()" class="text-xs px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 transition text-slate-600">登出</button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- 左側：計畫清單與進度 -->
    <div class="lg:col-span-1 space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="text-base font-bold text-slate-800 mb-4">專案與進度</h3>
        <div id="planSelectorContainer" class="space-y-2 mb-6">
          <!-- 動態載入計畫 -->
        </div>
        <div class="pt-4 border-t border-slate-100">
          <div class="flex justify-between text-sm mb-2 font-medium">
            <span class="text-slate-500">整體達成率</span>
            <span id="progressPercent" class="text-indigo-600 font-bold">0%</span>
          </div>
          <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側：100 目標清單呈現 -->
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex justify-between items-center mb-6">
          <h3 id="currentPlanTitle" class="text-lg font-bold text-slate-800">載入中計畫...</h3>
          <span id="completedCountBadge" class="text-xs px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full font-semibold">已完成 0 / 100</span>
        </div>
        <!-- 目標清單列表 -->
        <div id="goalsContainer" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
          <!-- 動態渲染目標 -->
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase 邏輯與主程式 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      sendPasswordResetEmail,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 專案設定檔 (對應您的專案 ID: teastd-a57c4)
    const firebaseConfig = {
      apiKey: "YOUR_WEB_API_KEY", // 請填入您 Firebase Console 專案設定中的 Web API Key
      authDomain: "teastd-a57c4.firebaseapp.com",
      projectId: "teastd-a57c4",
      storageBucket: "teastd-a57c4.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userPlans = {};
    let activePlanId = null;
    let isRegisterMode = false;
    let isForgotMode = false;

    // 監聽登入狀態
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("userDisplayName").textContent = user.displayName || user.email;
        document.getElementById("authOverlay").classList.add("hidden");
        await loadUserDataFromCloud(user.uid);
      } else {
        currentUser = null;
        userPlans = {};
        activePlanId = null;
        document.getElementById("authOverlay").classList.remove("hidden");
      }
    });

    // 從雲端載入資料
    async function loadUserDataFromCloud(uid) {
      try {
        const plansRef = collection(db, "users", uid, "plans");
        const querySnapshot = await getDocs(plansRef);
        userPlans = {};
        querySnapshot.forEach((docSnap) => {
          userPlans[docSnap.id] = docSnap.data();
        });

        // 若雲端無資料，建立預設 100 目標計畫
        if (Object.keys(userPlans).length === 0) {
          const defaultPlan = createDefaultPlan();
          userPlans[defaultPlan.id] = defaultPlan;
          await savePlanToCloud(defaultPlan);
        }

        activePlanId = Object.keys(userPlans)[0];
        renderApp();
      } catch (error) {
        console.error("載入雲端資料失敗:", error);
      }
    }

    function createDefaultPlan() {
      const goals = [];
      for (let i = 1; i <= 100; i++) {
        goals.push({ id: i, text: `人生目標第 ${i} 件事`, completed: false });
      }
      return {
        id: "plan_" + Date.now(),
        title: "我的 2027 終極目標清單",
        goals: goals
      };
    }

    async function savePlanToCloud(plan) {
      if (!currentUser) return;
      try {
        const planDocRef = doc(db, "users", currentUser.uid, "plans", plan.id);
        await setDoc(planDocRef, plan, { merge: true });
      } catch (error) {
        console.error("同步至雲端失敗:", error);
      }
    }

    // 渲染畫面
    window.renderApp = function() {
      const plan = userPlans[activePlanId];
      if (!plan) return;

      document.getElementById("currentPlanTitle").textContent = plan.title;
      
      const completedCount = plan.goals.filter(g => g.completed).length;
      const percent = Math.round((completedCount / 100) * 100);
      
      document.getElementById("completedCountBadge").textContent = `已完成 ${completedCount} / 100`;
      document.getElementById("progressPercent").textContent = `${percent}%`;
      document.getElementById("progressBar").style.width = `${percent}%`;

      const goalsHtml = plan.goals.map(g => `
        <div class="flex items-center p-3 rounded-xl border ${g.completed ? 'bg-emerald-50/50 border-emerald-200 text-emerald-900' : 'bg-slate-50 border-slate-200 text-slate-700'} transition">
          <input type="checkbox" ${g.completed ? 'checked' : ''} onchange="window.toggleGoal(${g.id})" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
          <span class="ml-3 text-sm font-medium ${g.completed ? 'line-through opacity-75' : ''}">${g.text}</span>
        </div>
      `).join('');

      document.getElementById("goalsContainer").innerHTML = goalsHtml;
    };

    window.toggleGoal = async function(goalId) {
      const plan = userPlans[activePlanId];
      if (!plan) return;
      const goal = plan.goals.find(g => g.id === goalId);
      if (goal) {
        goal.completed = !goal.completed;
        window.renderApp();
        await savePlanToCloud(plan);
      }
    };

    // 認證表單處理
    window.handleLoginSubmit = async function(event) {
      event.preventDefault();
      const email = document.getElementById("authEmail").value;
      const password = document.getElementById("authPassword").value;
      const name = document.getElementById("regName").value;

      try {
        if (isForgotMode) {
          await sendPasswordResetEmail(auth, email);
          alert("重設密碼信件已發送，請檢查您的電子信箱。");
          toggleForgotPassword();
        } else if (isRegisterMode) {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          if (name) await updateProfile(res.user, { displayName: name });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("操作失敗：" + error.message);
      }
    };

    window.toggleAuthMode = function() {
      isRegisterMode = !isRegisterMode;
      isForgotMode = false;
      document.getElementById("nameFieldContainer").classList.toggle("hidden", !isRegisterMode);
      document.getElementById("authTitle").textContent = isRegisterMode ? "建立專屬帳號" : "歡迎回來";
      document.getElementById("authSubmitBtn").textContent = isRegisterMode ? "立即註冊" : "登入系統";
      document.getElementById("authToggleText").textContent = isRegisterMode ? "已經有帳號？" : "還沒有帳號？";
      document.getElementById("authToggleBtn").textContent = isRegisterMode ? "返回登入" : "立即註冊";
    };

    window.toggleForgotPassword = function() {
      isForgotMode = !isForgotMode;
      document.getElementById("nameFieldContainer").classList.add("hidden");
      document.getElementById("authTitle").textContent = isForgotMode ? "重設密碼" : "歡迎回來";
      document.getElementById("authSubmitBtn").textContent = isForgotMode ? "發送重設信件" : "登入系統";
    };

    window.handleLogout = async function() {
      await signOut(auth);
      location.reload();
    };
  </script>
</body>
</html>
