<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生必做 100 件事 - 終極雲端同步版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f8fafc; }
    @media print {
      body { background-color: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- 登入 / 註冊 / 忘記密碼遮罩層 (未登入時顯示) -->
  <div id="authOverlay" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl max-w-md w-full p-8 relative overflow-hidden">
      
      <!-- 標題區 -->
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-indigo-500/30 mb-3">🎯</div>
        <h2 id="authTitle" class="text-2xl font-bold text-white">歡迎回來</h2>
        <p id="authSubtitle" class="text-sm text-slate-400 mt-1">登入以同步您的專屬人生願景與多週期計畫</p>
      </div>

      <!-- 登入表單 -->
      <form id="authForm" onsubmit="window.handleAuthSubmit(event)" class="space-y-4">
        <div id="nameFieldContainer" class="hidden">
          <label class="block text-xs font-semibold text-slate-400 mb-1">顯示名稱 (您的姓名或暱稱)</label>
          <input type="text" id="regName" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="例如：志鵬">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">電子信箱</label>
          <input type="email" id="authEmail" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="yourname@example.com">
        </div>
        <div id="passwordFieldContainer">
          <label class="block text-xs font-semibold text-slate-400 mb-1">密碼 (至少 6 碼)</label>
          <input type="password" id="authPassword" required minlength="6" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="••••••••">
        </div>

        <div class="flex items-center justify-between text-xs">
          <button type="button" onclick="window.switchAuthMode('forgot')" id="forgotPasswordBtn" class="text-indigo-400 hover:underline">忘記密碼？</button>
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">
          登入系統
        </button>
      </form>

      <!-- 切換模式按鈕 -->
      <div class="text-center mt-6 text-xs text-slate-400 space-x-1">
        <span id="authToggleText">還沒有帳號？</span>
        <button type="button" onclick="window.switchAuthMode('toggle')" id="authToggleBtn" class="text-indigo-400 font-semibold hover:underline">立即註冊</button>
      </div>
    </div>
  </div>

  <!-- 新增週期計畫彈跳視窗 -->
  <div id="newPlanModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-white">建立新的執行週期計畫</h3>
      <div>
        <label class="block text-xs text-slate-400 mb-1">計畫名稱</label>
        <input type="text" id="newPlanTitleInput" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例如：2027 年人生大躍進計畫">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">目標完成期限</label>
        <input type="date" id="newPlanDateInput" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="2027-12-31">
      </div>
      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="window.closeNewPlanModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs">取消</button>
        <button onclick="window.confirmCreateNewPlan()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">確認建立</button>
      </div>
    </div>
  </div>

  <!-- 自訂新增項目彈跳視窗 -->
  <div id="customItemModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-white">自行新增修煉項目</h3>
      <div>
        <label class="block text-xs text-slate-400 mb-1">選擇領域</label>
        <select id="customItemCategory" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="外表、髮型、儀容、穿搭">🧍 外表、髮型、儀容、穿搭</option>
          <option value="體態、運動、健康">💪 體態、運動、健康</option>
          <option value="睡眠與生活作息">😴 睡眠與生活作息</option>
          <option value="情緒穩定與成熟度">🧠 情緒穩定與成熟度</option>
          <option value="工作、能力與職涯">💼 工作、能力與職涯</option>
          <option value="財務與消費習慣">💰 財務與消費習慣</option>
          <option value="感情、社交與界線">❤️ 感情、社交與界線</option>
          <option value="談吐、溝通與氣質">🗣️ 談吐、溝通與氣質</option>
          <option value="閱讀、品味與生活品質">🎵 閱讀、品味與生活品質</option>
          <option value="房間、手機、數位生活">🏠 房間、手機、數位生活</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">目標內容描述</label>
        <input type="text" id="customItemTextInput" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例如：每個月讀完兩本商業經營好書">
      </div>
      <div class="flex justify-end space-x-3 pt-2">
        <button onclick="window.closeCustomItemModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs">取消</button>
        <button onclick="window.confirmAddCustomItem()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">新增至清單</button>
      </div>
    </div>
  </div>

  <!-- 最終覆盤與 PDF 匯出彈跳視窗 -->
  <div id="reviewModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full p-8 space-y-6 shadow-2xl my-8">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <h3 id="reviewModalTitle" class="text-xl font-bold text-white">📊 週期最終覆盤與自我評分</h3>
        <button onclick="window.closeReviewModal()" class="text-slate-400 hover:text-white text-sm">✕ 關閉</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">整體自我評分 (0 ~ 100 分)</label>
          <input type="number" id="reviewScoreInput" min="0" max="100" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="例如：85">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">本週期綜合心得與深度反思</label>
          <textarea id="reviewNotesInput" rows="4" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="記錄這段期間的收穫、突破與未來改善方向..."></textarea>
        </div>
        <div>
          <h4 class="text-sm font-bold text-slate-300 mb-2">📌 未完成項目追蹤清單</h4>
          <div id="unfinishedListContainer" class="max-h-48 overflow-y-auto space-y-2 bg-slate-950/50 p-3 rounded-xl border border-slate-800 text-xs text-slate-400">
            <!-- 動態填入未完成項目 -->
          </div>
        </div>
      </div>

      <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
        <button onclick="window.saveReviewData()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold">儲存覆盤資料</button>
        <button onclick="window.exportPDF()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">📥 匯出並列印 PDF 報表</button>
      </div>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-indigo-600/30">🎯</div>
        <h1 class="text-base sm:text-lg font-bold text-white tracking-wide">願景與 100 項人生必做清單</h1>
      </div>

      <!-- 週期切換與功能列 -->
      <div class="flex items-center space-x-2 flex-wrap">
        <select id="planSelector" onchange="window.switchActivePlan(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <!-- 動態載入 -->
        </select>
        <button onclick="window.openNewPlanModal()" class="text-xs px-3 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 rounded-xl transition font-medium">+ 新週期</button>
        <button onclick="window.resetAndChangeGoals()" class="text-xs px-3 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 rounded-xl transition font-medium">🎲 重設/換100項</button>
        <button onclick="window.openReviewModal()" class="text-xs px-3 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 rounded-xl transition font-medium">📊 最終覆盤與PDF</button>
        <span id="userDisplayName" class="text-xs text-slate-300 font-medium px-2">載入中...</span>
        <button onclick="window.handleLogout()" class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">登出</button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
    
    <!-- 頂部儀表板與進度卡片 -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-center">
        <!-- 進度環形數字 -->
        <div class="flex items-center space-x-5 md:border-r border-slate-800 pr-4">
          <div class="relative w-24 h-24 flex items-center justify-center bg-slate-800/80 rounded-full border-4 border-slate-700">
            <span id="progressPercentText" class="text-2xl font-bold text-white">0%</span>
          </div>
          <div>
            <div id="completedRatioText" class="text-lg font-bold text-white">0 / 100 已完成</div>
            <div id="daysRemainingText" class="text-xs text-slate-400 mt-1">期限倒數計算中...</div>
          </div>
        </div>

        <!-- 專案標題與分類統計 -->
        <div class="md:col-span-3 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 id="currentPlanTitle" class="text-xl font-bold text-white tracking-wide">載入中計畫...</h2>
            <span id="currentPlanDeadline" class="text-xs px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">目標期限：---</span>
          </div>
          
          <!-- 10大類別小標籤統計 -->
          <div id="categoryBadges" class="flex flex-wrap gap-1.5 pt-1">
            <!-- 動態生成 -->
          </div>
        </div>
      </div>
    </section>

    <!-- 搜尋與過濾工具列 -->
    <section class="flex flex-col md:flex-row gap-3 items-center justify-between bg-slate-900/50 p-3 rounded-2xl border border-slate-800/80 no-print">
      <div class="w-full md:w-80 relative">
        <input type="text" id="searchInput" oninput="window.filterGoals()" placeholder="搜尋關鍵字、心得備註..." class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <select id="categoryFilter" onchange="window.filterGoals()" class="bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">全部 10 大類別領域</option>
          <option value="外表、髮型、儀容、穿搭">🧍 外表、髮型、儀容、穿搭</option>
          <option value="體態、運動、健康">💪 體態、運動、健康</option>
          <option value="睡眠與生活作息">😴 睡眠與生活作息</option>
          <option value="情緒穩定與成熟度">🧠 情緒穩定與成熟度</option>
          <option value="工作、能力與職涯">💼 工作、能力與職涯</option>
          <option value="財務與消費習慣">💰 財務與消費習慣</option>
          <option value="感情、社交與界線">❤️ 感情、社交與界線</option>
          <option value="談吐、溝通與氣質">🗣️ 談吐、溝通與氣質</option>
          <option value="閱讀、品味與生活品質">🎵 閱讀、品味與生活品質</option>
          <option value="房間、手機、數位生活">🏠 房間、手機、數位生活</option>
        </select>

        <select id="statusFilter" onchange="window.filterGoals()" class="bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">全部狀態</option>
          <option value="completed">已完成</option>
          <option value="uncompleted">未完成</option>
        </select>

        <button onclick="window.openCustomItemModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition">+ 自行新增項目</button>
      </div>
    </section>

    <!-- 目標清單卡片網格 -->
    <section class="space-y-4">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-sm font-semibold text-slate-400 tracking-wider uppercase">百項修煉清單列表</h3>
        <span id="displayCountText" class="text-xs text-slate-500">顯示 100 項</span>
      </div>

      <div id="goalsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 動態渲染卡片 -->
      </div>
    </section>

  </main>

  <!-- Firebase 邏輯與主程式 -->

      "財務與消費習慣": [

        "研究並執行至少 3 檔優質長期配息 ETF 定期定額", "執行嚴格的「延遲滿足消費法」，避免衝動購物",

        "定期安排與父母及摯愛親友的深度陪伴聚餐", "學會遠離消耗能量的毒性人際關係（Toxic Relationships）",
        "為伴侶或重要他人精心策劃一場難忘的浪漫約會", "手寫並寄出感謝信給生命中曾幫助過自己的貴人",
        "擴大優質社交圈，結識 5 位以上各領域優秀同好"
      ],
      "談吐、溝通與氣質": [
        "說話語調溫和堅定、邏輯清晰且富有同理心", "練習「深度傾聽」，在對話中給予對方真誠的回饋",
        "閱讀 3 本溝通心理學與演說表達經典書籍", "在公開場合演講或簡報時能做到從容不迫、眼神自信",
        "減少口頭禪與急躁情緒，展現沉穩大氣的談吐氣質"

      "閱讀、品味與生活品質": [
        "一年內讀完並輸出 24 本深度好書的閱讀筆記", "學會手沖精品咖啡、品茶或品酒的生活美學儀式",
        "親手烹調 10 道健康美味的拿手私房料理", "造訪 3 家充滿美學設計感的獨立書店或藝文展覽",
        "為居家空間添購一盞質感桌燈或香氛營造氛圍"
      ],
      "房間、手機、數位生活": [
        "執行房間「斷捨離」，維持桌面與衣櫃隨時整潔清爽", "徹底整理手機 App 頁面與電腦雲端硬碟的數位檔案",
        "每週進行一次 3C 產品與生活環境的深度大掃除", "定期備份重要照片與工作檔案至雲端或外接硬碟",
        "設定手機螢幕使用時間限制，減少無意識刷社群"
      ]
    };

    // 自動產生 100 項豐富目標（每大類 10 項，合計 100 項）
    function generateRandom100Goals() {
      const goals = [];
      let idCounter = 1;
      
      categoriesList.forEach(cat => {
        const pool = [...(goalPools[cat] || ["在該領域達成重大突破與日常精進"])];
        // 隨機打亂題庫
        pool.sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < 10; i++) {
          const text = pool[i % pool.length] + (i >= pool.length ? ` (進階修煉 #${i+1})` : '');
          goals.push({
            id: idCounter++,
            category: cat,
            text: text,
            completed: false,
            completedAt: "",
            note: ""
          });
        }
      });

      goals.sort(() => Math.random() - 0.5);
      goals.forEach((g, idx) => g.id = idx + 1);
      return goals;
    }

    // 監聽登入狀態
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("userDisplayName").textContent = user.displayName || user.email;
        document.getElementById("authOverlay").classList.add("hidden");
        await loadUserDataFromCloud(user.uid);
      } else {
        currentUser = null;
        userPlans = {};
        activePlanId = null;
        document.getElementById("authOverlay").classList.remove("hidden");
      }
    });

    // 從雲端載入資料
    async function loadUserDataFromCloud(uid) {
      try {
        const plansRef = collection(db, "users", uid, "plans");
        const querySnapshot = await getDocs(plansRef);
        userPlans = {};
        querySnapshot.forEach((docSnap) => {
          userPlans[docSnap.id] = docSnap.data();
        });

        if (Object.keys(userPlans).length === 0) {
          const defaultPlan = {
            id: "plan_2026",
            title: "2026 年底終極願景計畫",
            targetDate: "2026-12-31",
            goals: generateRandom100Goals(),
            reviewScore: "",
            reviewNotes: ""
          };
          userPlans[defaultPlan.id] = defaultPlan;
          await savePlanToCloud(defaultPlan);
        }

        activePlanId = Object.keys(userPlans)[0];
        renderPlanSelector();
        renderApp();
      } catch (error) {
        console.error("載入雲端資料失敗:", error);
      }
    }

    async function savePlanToCloud(plan) {
      if (!currentUser) return;
      try {
        const planDocRef = doc(db, "users", currentUser.uid, "plans", plan.id);
        await setDoc(planDocRef, plan, { merge: true });
      } catch (error) {
        console.error("同步至雲端失敗:", error);
      }
    }

    window.renderPlanSelector = function() {
      const selector = document.getElementById("planSelector");
      let html = "";
      Object.values(userPlans).forEach(plan => {
        html += `<option value="${plan.id}" ${plan.id === activePlanId ? 'selected' : ''}>🎯 ${plan.title} (${plan.targetDate})</option>`;
      });
      selector.innerHTML = html;
    };

    window.switchActivePlan = function(planId) {
      if (userPlans[planId]) {
        activePlanId = planId;
        renderApp();
      }
    };

    // 新增週期計畫彈跳視窗
    window.openNewPlanModal = function() {
      document.getElementById("newPlanModal").classList.remove("hidden");
      document.getElementById("newPlanTitleInput").value = "";
      document.getElementById("newPlanDateInput").value = "2027-12-31";
    };
    window.closeNewPlanModal = function() {
      document.getElementById("newPlanModal").classList.add("hidden");
    };
    window.confirmCreateNewPlan = async function() {
      const title = document.getElementById("newPlanTitleInput").value.trim() || "新年度人生願景計畫";
      const targetDate = document.getElementById("newPlanDateInput").value || "2027-12-31";
      
      const newPlanId = "plan_" + Date.now();
      const newPlan = {
        id: newPlanId,
        title: title,
        targetDate: targetDate,
        goals: generateRandom100Goals(),
        reviewScore: "",
        reviewNotes: ""
      };

      userPlans[newPlanId] = newPlan;
      activePlanId = newPlanId;
      
      await savePlanToCloud(newPlan);
      closeNewPlanModal();
      renderPlanSelector();
      renderApp();
    };

    // 重設/換 100 項
    window.resetAndChangeGoals = async function() {
      const plan = userPlans[activePlanId];
      if (!plan) return;

      if (confirm(`確定要為「${plan.title}」重新洗牌並更換全新不同的 100 項人生修煉目標嗎？目前的打勾進度將會重新計算。`)) {
        plan.goals = generateRandom100Goals();
        await savePlanToCloud(plan);
        renderApp();
        alert("已成功換上全新不同的 100 項人生目標！");
      }
    };

    // 自訂新增項目
    window.openCustomItemModal = function() {
      document.getElementById("customItemModal").classList.remove("hidden");
      document.getElementById("customItemTextInput").value = "";
    };
    window.closeCustomItemModal = function() {
      document.getElementById("customItemModal").classList.add("hidden");
    };
    window.confirmAddCustomItem = async function() {
      const cat = document.getElementById("customItemCategory").value;
      const text = document.getElementById("customItemTextInput").value.trim();
      if (!text) {
        alert("請輸入目標內容描述！");
        return;
      }
      const plan = userPlans[activePlanId];
      if (!plan) return;

      const newId = plan.goals.length > 0 ? Math.max(...plan.goals.map(g => g.id)) + 1 : 1;
      plan.goals.push({
        id: newId,
        category: cat,
        text: text,
        completed: false,
        completedAt: "",
        note: ""
      });

      await savePlanToCloud(plan);
      closeCustomItemModal();
      renderApp();
      alert("成功新增自訂修煉項目！");
    };

    // 最終覆盤彈跳視窗
    window.openReviewModal = function() {
      const plan = userPlans[activePlanId];
      if (!plan) return;

      document.getElementById("reviewModalTitle").textContent = `📊 最終覆盤：${plan.title}`;
      document.getElementById("reviewScoreInput").value = plan.reviewScore || "";
      document.getElementById("reviewNotesInput").value = plan.reviewNotes || "";

      const uncompleted = plan.goals.filter(g => !g.completed);
      const container = document.getElementById("unfinishedListContainer");
      if (uncompleted.length === 0) {
        container.innerHTML = `<p class="text-emerald-400 font-medium">太棒了！所有 100 項目標皆已完美達成完畢！</p>`;
      } else {
        container.innerHTML = uncompleted.map(g => `<div class="p-2 bg-slate-900 rounded border border-slate-800"><span class="text-indigo-400 font-mono">[#${g.id}] [${g.category}]</span> ${g.text}</div>`).join('');
      }

      document.getElementById("reviewModal").classList.remove("hidden");
    };
    window.closeReviewModal = function() {
      document.getElementById("reviewModal").classList.add("hidden");
    };
    window.saveReviewData = async function() {
      const plan = userPlans[activePlanId];
      if (!plan) return;

      plan.reviewScore = document.getElementById("reviewScoreInput").value;
      plan.reviewNotes = document.getElementById("reviewNotesInput").value;

      await savePlanToCloud(plan);
      alert("覆盤資料已成功儲存至雲端！");
      closeReviewModal();
    };

    // 匯出 PDF
    window.exportPDF = function() {
      window.print();
    };

    // 渲染主畫面
    window.renderApp = function() {
      const plan = userPlans[activePlanId];
      if (!plan) return;

      document.getElementById("currentPlanTitle").textContent = plan.title;
      document.getElementById("currentPlanDeadline").textContent = `目標期限：${plan.targetDate || '未設定'}`;

      if (plan.targetDate) {
        const diffTime = new Date(plan.targetDate) - new Date();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById("daysRemainingText").textContent = diffDays >= 0 ? `距離目標截止剩餘 ${diffDays} 天` : `已超過期限`;
      }

      const total = plan.goals.length;
      const completedCount = plan.goals.filter(g => g.completed).length;
      const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;

      document.getElementById("progressPercentText").textContent = `${percent}%`;
      document.getElementById("completedRatioText").textContent = `${completedCount} / ${total} 已完成`;

      let badgesHtml = "";
      categoriesList.forEach(cat => {
        const catGoals = plan.goals.filter(g => g.category === cat);
        const catDone = catGoals.filter(g => g.completed).length;
        badgesHtml += `<span class="text-xs px-2.5 py-1 bg-slate-800 border border-slate-700 text-slate-300 rounded-lg font-medium">📁 ${cat} (${catDone}/${catGoals.length})</span>`;
      });
      document.getElementById("categoryBadges").innerHTML = badgesHtml;

      window.filterGoals();
    };

    // 篩選與渲染卡片
    window.filterGoals = function() {
      const plan = userPlans[activePlanId];
      if (!plan) return;

      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const selectedCat = document.getElementById("categoryFilter").value;
      const selectedStatus = document.getElementById("statusFilter").value;

      const filtered = plan.goals.filter(g => {
        const matchKeyword = g.text.toLowerCase().includes(keyword) || (g.note && g.note.toLowerCase().includes(keyword));
        const matchCat = selectedCat === 'all' || g.category === selectedCat;
        const matchStatus = selectedStatus === 'all' || 
                            (selectedStatus === 'completed' && g.completed) || 
                            (selectedStatus === 'uncompleted' && !g.completed);
        return matchKeyword && matchCat && matchStatus;
      });

      document.getElementById("displayCountText").textContent = `顯示 ${filtered.length} / ${plan.goals.length} 項`;

      const gridHtml = filtered.map(g => `
        <div class="bg-slate-900 border ${g.completed ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-slate-800'} rounded-2xl p-5 flex flex-col justify-between space-y-4 shadow-md transition hover:border-slate-700">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center space-x-3">
              <input type="checkbox" ${g.completed ? 'checked' : ''} onchange="window.toggleGoal(${g.id})" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer mt-0.5">
              <span class="text-sm font-medium ${g.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${g.text}</span>
            </div>
            <span class="text-xs px-2 py-0.5 bg-slate-800 text-slate-400 rounded-md font-mono shrink-0">#${g.id}</span>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800/60 text-xs text-slate-400">
            <div class="flex items-center space-x-2">
              <span class="px-2 py-0.5 bg-indigo-500/10 text-indigo-400 rounded">${g.category || '一般'}</span>
              <span class="text-slate-500">完成日期: ${g.completedAt || 'yyyy/mm/dd'}</span>
            </div>
            <div>
              <input type="text" value="${g.note || ''}" placeholder="+新增心得備註" onchange="window.updateGoalNote(${g.id}, this.value)" class="bg-slate-800/80 border border-slate-700/60 rounded px-2.5 py-1 text-xs text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500 w-36">
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById("goalsGrid").innerHTML = gridHtml || `<div class="col-span-2 text-center py-12 text-slate-500">沒有找到符合條件的目標項目</div>`;
    };

    window.toggleGoal = async function(goalId) {
      const plan = userPlans[activePlanId];
      if (!plan) return;
      const goal = plan.goals.find(g => g.id === goalId);
      if (goal) {
        goal.completed = !goal.completed;
        const now = new Date();
        goal.completedAt = goal.completed ? `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}` : "";
        
        window.renderApp();
        await savePlanToCloud(plan);
      }
    };

    window.updateGoalNote = async function(goalId, noteText) {
      const plan = userPlans[activePlanId];
      if (!plan) return;
      const goal = plan.goals.find(g => g.id === goalId);
      if (goal) {
        goal.note = noteText;
        await savePlanToCloud(plan);
      }
    };

    // 認證介面切換
    window.switchAuthMode = function(mode) {
      if (mode === 'toggle') {
        authMode = authMode === 'login' ? 'register' : 'login';
      } else if (mode === 'forgot') {
        authMode = 'forgot';
      }

      const title = document.getElementById("authTitle");
      const subtitle = document.getElementById("authSubtitle");
      const submitBtn = document.getElementById("authSubmitBtn");
      const nameContainer = document.getElementById("nameFieldContainer");
      const passContainer = document.getElementById("passwordFieldContainer");
      const toggleText = document.getElementById("authToggleText");
      const toggleBtn = document.getElementById("authToggleBtn");
      const forgotBtn = document.getElementById("forgotPasswordBtn");

      if (authMode === 'register') {
        title.textContent = "建立專屬帳號";
        subtitle.textContent = "開啟您的多週期願景管理與雲端同步";
        submitBtn.textContent = "立即註冊";
        nameContainer.classList.remove("hidden");
        passContainer.classList.remove("hidden");
        toggleText.textContent = "已經有帳號？";
        toggleBtn.textContent = "返回登入";
        forgotBtn.style.display = "none";
      } else if (authMode === 'forgot') {
        title.textContent = "重設密碼";
        subtitle.textContent = "輸入您的註冊信箱以接收密碼重設信件";
        submitBtn.textContent = "發送重設信件";
        nameContainer.classList.add("hidden");
        passContainer.classList.add("hidden");
        toggleText.textContent = "想起來了？";
        toggleBtn.textContent = "返回登入";
        forgotBtn.style.display = "none";
      } else {
        authMode = 'login';
        title.textContent = "歡迎回來";
        subtitle.textContent = "登入以同步您的專屬人生願景與多週期計畫";
        submitBtn.textContent = "登入系統";
        nameContainer.classList.add("hidden");
        passContainer.classList.remove("hidden");
        toggleText.textContent = "還沒有帳號？";
        toggleBtn.textContent = "立即註冊";
        forgotBtn.style.display = "inline-block";
      }
    };

    window.handleAuthSubmit = async function(event) {
      event.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const name = document.getElementById("regName").value.trim();

      try {
        if (authMode === 'forgot') {
          await sendPasswordResetEmail(auth, email);
          alert("重設密碼信件已發送至您的信箱，請至信箱收信並重設密碼。");
          window.switchAuthMode('login');
        } else if (authMode === 'register') {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          if (name) {
            await updateProfile(res.user, { displayName: name });
          }
          alert("註冊成功！已自動登入系統。");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert("操作失敗：" + error.message);
      }
    };

    window.handleLogout = async function() {
      await signOut(auth);
      location.reload();
    };
  </script>
</body>
